name: Fork conflict repair notification

on:
  workflow_run:
    workflows: [Fork nightly]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: fork-conflict-notification
  cancel-in-progress: false

jobs:
  notify:
    if: github.repository == 'amv146/t3code' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Verify conflict routing
        run: node --test .github/scripts/fork-nightly.test.cjs .github/scripts/fork-conflict-notify.test.cjs
      - name: Verify and assign a nightly conflict to Copilot
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REPAIR_ENABLED: ${{ vars.FORK_COPILOT_REPAIR_ENABLED }}
          HAS_AGENT_TOKEN: ${{ secrets.FORK_COPILOT_AGENT_TOKEN != '' }}
        with:
          github-token: ${{ secrets.FORK_COPILOT_AGENT_TOKEN || github.token }}
          script: |
            const enabled = process.env.REPAIR_ENABLED === 'true';
            if (enabled && process.env.HAS_AGENT_TOKEN !== 'true') {
              throw new Error('Set FORK_COPILOT_AGENT_TOKEN before enabling hosted repair.');
            }
            const { notifyForkConflict } = require('./.github/scripts/fork-conflict-notify.cjs');
            await notifyForkConflict({
              github, context, core, enabled,
            });
