name: Fork PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Base ref for changed-file checks
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: fork-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Fork PR validation
    if: github.repository == 'amv146/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Default credential persistence avoids early cleanup of vendored gitlinks without .gitmodules.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: ./.github/actions/setup-apt-mirrors
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}
      - name: Install Chromium for changed browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium
      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          libraries=$(ldd "$browser")
          if grep '=> not found' <<< "$libraries"; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi
      - name: Check changes against the target branch
        env:
          BASE: ${{ github.event.pull_request.base.sha || format('origin/{0}', inputs.base) }}
        # Nightly merges can select hundreds of serial Git/SQLite test files.
        run: vp run check:changed "$BASE" --timeout 2100
